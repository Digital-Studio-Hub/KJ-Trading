<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | KJ Trading (Pty) Ltd</title>
  <meta name="description" content="Photo gallery of KJ Trading gate motors, custom gates, sectional garage doors and CCTV installations in Cape Town and the Western Cape." />
  <link rel="canonical" href="https://kjtradeversatile.co.za/gallery.html" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body data-page="gallery">
  <div id="topbar"></div>
  <header id="header"></header>
  <main>
    <section class="page-hero" style="background-image:url('assets/hero-gate.jpg')">
      <div class="container">
        <p class="eyebrow">Gallery</p>
        <h1>See the work up close</h1>
        <p>Hover a photo for details, or tap to open a larger view.</p>
      </div>
    </section>
    <section class="section">
      <div class="container gallery-grid">
        <figure class="gallery-item" data-full="assets/hero-gate.jpg" data-caption="Automated driveway gate with Centurion motor and remote">
          <img src="assets/hero-gate.jpg" alt="Automated driveway gate" />
          <figcaption><strong>Driveway automation</strong><br>Centurion sliding kit with remote.</figcaption>
        </figure>
        <figure class="gallery-item" data-full="assets/gate-motor.webp" data-caption="Sliding gate motor installation">
          <img src="assets/gate-motor.webp" alt="Sliding gate motor" />

        </figure>
        <figure class="gallery-item" data-full="assets/sliding-gate.jpg" data-caption="Smart sliding gate with app control">
          <img src="assets/sliding-gate.jpg" alt="Smart sliding gate" />
          <figcaption><strong>Smart access</strong><br>Remote and phone control.</figcaption>
        </figure>
        <figure class="gallery-item" data-full="assets/swing-gate.jpg" data-caption="Custom swing gates">
          <img src="assets/swing-gate.jpg" alt="Custom swing gates" />
          <figcaption><strong>Swing gates</strong><br>Fabricated steel with automators.</figcaption>
        </figure>
        <figure class="gallery-item" data-full="assets/motors-range.jpg" data-caption="Gate motor brands we install">
          <img src="assets/motors-range.jpg" alt="Gate motor product range" />
          <figcaption><strong>Motors we fit</strong><br>Centurion, Gemini, ET and more.</figcaption>
        </figure>
        <figure class="gallery-item" data-full="assets/centurion-smart.jpg" data-caption="Centurion SMART+ motors">
          <img src="assets/centurion-smart.jpg" alt="Centurion SMART+ range" />

        </figure>
        <figure class="gallery-item" data-full="assets/garage-install.jpg" data-caption="Sectional garage door installation">

        </figure>
        <figure class="gallery-item" data-full="assets/garage-sectional.jpg" data-caption="Sectional door tracks">
          <img src="assets/garage-sectional.jpg" alt="Sectional garage door tracks" />

        </figure>
        <figure class="gallery-item" data-full="assets/garage-tech.webp" data-caption="Garage motor installation">
          <img src="assets/garage-tech.webp" alt="Garage motor technician" />

        </figure>
        <figure class="gallery-item" data-full="assets/garage-motor.jpg" data-caption="Residential garage door motor">
          <img src="assets/garage-motor.jpg" alt="Residential garage door motor" />
          <figcaption><strong>Residential motor</strong><br>Remote and app operation.</figcaption>
        </figure>
        <figure class="gallery-item" data-full="assets/cctv-install.jpg" data-caption="CCTV dome camera installation">
          <img src="assets/cctv-install.jpg" alt="CCTV dome camera" />
          <figcaption><strong>Dome CCTV</strong><br>Professional camera fitment.</figcaption>
        </figure>
        <figure class="gallery-item" data-full="assets/cctv-camera.jpg" data-caption="Bullet camera install">
          <img src="assets/cctv-camera.jpg" alt="Bullet CCTV camera" />
